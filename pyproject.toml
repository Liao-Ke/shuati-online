[project]
name = "shuati-online"
version = "1.0.0"
description = "轻量级在线刷题平台"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402"]
"routers/*" = ["B008"]
"auth.py" = ["B008"]
"routers/wrong_answers.py" = ["E712"]

[tool.ruff.lint.isort]
known-first-party = [
    "database",
    "models",
    "schemas",
    "auth",
    "logging_config",
    "utils",
    "routers",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
