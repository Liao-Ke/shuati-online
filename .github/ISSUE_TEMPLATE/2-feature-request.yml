name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: existing
    attributes:
      label: 是否已存在类似建议？
      description: 请先搜索是否已有相同功能的建议
      options:
        - label: 我已搜索过现有 Issue
          required: true
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 简要描述你想要的功能或改进
      placeholder: 我希望能...
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 描述这个功能解决什么问题，或在什么场景下使用
      placeholder: 当我在...的时候，我需要...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果有具体的实现思路，可以在这里描述
      placeholder: 可以考虑通过...来实现
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其他替代方案？
      placeholder: 也可以考虑...
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出功能完成的标准
      value: |
        - [ ] 标准 1
        - [ ] 标准 2
  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 添加原型图、参考链接或其他相关资料。可以直接拖拽图片到此区域。
